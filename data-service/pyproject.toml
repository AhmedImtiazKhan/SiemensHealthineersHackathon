[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "pilltalk-data"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "httpx>=0.27,<1", "defusedxml>=0.7,<1", "xlrd>=2,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.scripts]
pilltalk = "pilltalk.cli:main"
[tool.setuptools.packages.find]
include = ["pilltalk*"]
